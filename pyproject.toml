[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[project]
name = "voicestudio"
version = "5.16.0"
description = "VoiceStudio: A unified toolkit for voice cloning, designing and editing"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "LatentForge", email = "brew.airesearch@gmail.com" }
]
keywords = [ "text-to-speech", "voice-synthesis", "audio-generation" ]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "transformers[kernels]>=5.16.1",
]
[project.optional-dependencies]
research = [  # full-research setup
    "voicestudio[cloud]",
    "voicestudio[audio]",
    "voicestudio[omni]",
    "voicestudio[train]",
    "voicestudio[eval]",
]
cloud = [  # nvidia infra setup
    "torch ; platform_system == 'Windows'",
    "torch>=2.8.0",
    "accelerate>=1.10.0",
    "hf-xet>=1.1.8",
    "numpy>=2.3.5",
]
native = [  # on-device setup
    "torchnative",
]
desktop = [
    "fastapi>=0.126.0",
]
audio = [  # audio processing
    "torchaudio",
    "torchcodec",
    "soundfile>=0.13.1",
]
omni = [  # multimodal processing
    "pillow",
    "torchvision",
]
train = [
    "torchao>=0.18.0",
    "matplotlib>=3.10.5",
    "wandb>=0.21.1",
    "tqdm>=4.67.1",
    "notebook>=7.4.5",
    "ipywidgets>=8.1.7",
]
eval = [
    "voicestudio[audio]",
    "jiwer>=4.0.0",
]
bench = [
    "inspect-ai>=0.3.263",
    "vllm>=0.28.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-windows", marker = "platform_system == 'Windows'" },
]

[[tool.uv.index]]
name = "pytorch-windows"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = [ "voicestudio" ]

[project.urls]
Homepage = "https://latentforge.github.io/"
Repository = "https://github.com/LatentForge/VoiceStudio"
