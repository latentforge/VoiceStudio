[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[project]
name = "voicestudio"
version = "1.1.0"
description = "VoiceStudio: A unified toolkit for voice cloning, designing and editing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "LatentForge", email = "brew.airesearch@gmail.com" }
]
keywords = [ "text-to-speech", "voice-synthesis", "audio-generation" ]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=2.3.5",
    "torch ; platform_system == 'Windows'",
    "torch>=2.8.0",
    "torchaudio ; platform_system == 'Windows'",
    "torchaudio>=2.8.0",
    "torchcodec>=0.9.1",
    "librosa>=0.11.0",
    "soundfile>=0.13.1",
    "transformers>=5.3.0",
    "hf-xet>=1.1.8",
    "tqdm>=4.67.1",
]
[project.optional-dependencies]
all = [
    "voicestudio[train]",
    "voicestudio[eval]",
    "voicestudio[kernels]",
    "voicestudio[omni]",
    "voicestudio[onnx]",
    "voicestudio[web]",
]
kernels = [
    "transformers[kernels]",
]
train = [
    "accelerate>=1.10.0",
    "matplotlib>=3.10.5",
    "wandb>=0.21.1",
    "notebook>=7.4.5",
    "ipywidgets>=8.1.7",
]
eval = [
    "pyworld>=0.3.5",  # f0 extraction for CosyVoice's vocoder objective
    "jiwer>=4.0.0",  # word error rate, the transcription check in CLAUDE.md section 2.5
]
omni = [
    "pillow",
    "torchvision",
]
onnx = [
    "onnxruntime-gpu[cuda,cudnn]>=1.18.0 ; platform_system == 'Linux' or platform_system == 'Windows'",
    "onnxruntime>=1.18.0 ; platform_system == 'Darwin'",
    "onnx",
]
native = [  # on-device inference
    "torchnative",
]
web = [  # Voice Studio Web
    "fastapi>=0.126.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-windows", marker = "platform_system == 'Windows'" },
]
torchaudio = [
    { index = "pytorch-windows", marker = "platform_system == 'Windows'" },
]
transformers = { git = "https://github.com/latentforge/transformers-tts", branch = "research" }

[[tool.uv.index]]
name = "pytorch-windows"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = [ "voicestudio" ]

[project.urls]
Homepage = "https://latentforge.github.io/"
Repository = "https://github.com/LatentForge/VoiceStudio"
